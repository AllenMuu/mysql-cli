name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'dist/npm/**'
      - '.goreleaser.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

# 同一个 ref 上的 release 不要并发跑，避免 tag 重推时双跑导致发布产物冲突。
# PR 跑的 check job 用 github.event.pull_request 隔离，互不影响。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # 第三方 action pin 到完整 commit SHA（GitHub 安全最佳实践），
      # SHA 来自 goreleaser-action v7.2.3 release tag。
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: check
      - name: npm wrapper tests
        working-directory: dist/npm
        run: node --test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version from tag and publish
        working-directory: dist/npm
        run: |
          npm version "$(echo "${{ github.ref_name }}" | sed 's/^v//')" --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
